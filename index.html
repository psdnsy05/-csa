<style>
  :root {

    --surface: #131929;

    --border: #263047;
    --accent: #4f8ef7;
    --accent2: #38d9a9;
    --wrong: #ff6b6b;
    --text: #e8edf5;
    --muted: #7a8ba8;

  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .header h1 {
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 600;
    line-height: 1.2;
  }
  .header p {
    color: var(--muted);
    margin-top: 8px;
    font-size: 14px;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    max-width: 640px;
    margin: 0 auto 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .progress-top span:last-child { color: var(--accent); font-family: var(--mono); }
  .bar-bg {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ── QUESTION CARD ── */
  .q-card {
    max-width: 640px;
    margin: 0 auto 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .q-card.correct { border-color: var(--accent2); }
  .q-card.incorrect { border-color: var(--wrong); }

  .q-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .q-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    background: rgba(79,142,247,0.1);
    border: 1px solid rgba(79,142,247,0.25);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .q-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
    flex: 1;
  }

  /* ── OPTIONS ── */
  .options {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    width: 100%;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    font-family: var(--sans);
  }
  .opt:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(79,142,247,0.07);
  }
  .opt .letter {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    min-width: 18px;
    margin-top: 1px;
  }
  .opt.selected-correct {
    border-color: var(--accent2);
    background: rgba(56,217,169,0.1);
  }
  .opt.selected-correct .letter { color: var(--accent2); }
  .opt.selected-wrong {
    border-color: var(--wrong);
    background: rgba(255,107,107,0.1);
  }
  .opt.selected-wrong .letter { color: var(--wrong); }
  .opt.reveal-correct {
    border-color: var(--accent2);
    background: rgba(56,217,169,0.06);
  }
  .opt.reveal-correct .letter { color: var(--accent2); }
  .opt:disabled { cursor: default; }

  .explanation {
    margin: 0 16px 16px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.6;
    display: none;
  }
  .explanation.correct-exp {
    background: rgba(56,217,169,0.08);
    border: 1px solid rgba(56,217,169,0.25);
    color: #8ef5d7;
  }

    border: 1px solid rgba(255,107,107,0.25);
    color: #ffaeae;
  }

    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
    opacity: 0.7;
  }
  .explanation .exp-answer {
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

    max-width: 640px;

    text-align: center;
    display: none;
    padding: 40px 24px;
    background: var(--card);

    justify-content: center;
    gap: 24px;
    margin-top: 24px;
    flex-wrap: wrap;

  .bd-box {
    padding: 14px 22px;
    border-radius: 12px;
    border: 1px solid var(--border);

  .bd-box .bd-num { font-family: var(--mono); font-size: 28px; font-weight: 700; }

  .bd-box.w { border-color: rgba(255,107,107,0.4); }

  .restart-btn {
    margin-top: 28px;
    padding: 12px 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0b0f1a;
    font-weight: 700;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 1px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .restart-btn:hover { opacity: 0.85; }

  /* ── STICKY SUBMIT ── */
  #submit-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 14px 20px;
    background: rgba(11,15,26,0.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  #submit-btn {
    padding: 12px 36px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 1px;
    border: none;
    border-radius: 10px;
    cursor: pointer;

  #submit-btn:disabled { opacity: 0.4; cursor: default; }
  #submit-hint { font-size: 12px; color: var(--muted); }

      "It is a process of splitting the system in smaller chunks since people can work better by working on smaller separate tasks.",
      "It is a method that allows people to complicate data."
    ],

    exp: "Abstraction in computer architecture involves characterizing objects or systems at different levels of representation, creating models that hide complexity and allow designers to work a[...]"

    opts: [

      "It executes the part of each different instruction.",

// Shuffle helper
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// State
let questions = [];
let userAnswers = [];
let submitted = false;

function updateProgress() {
  const answered = userAnswers.filter(a => a !== null).length;
  document.getElementById('prog-text').textContent = `${answered} / ${questions.length} answered`;
  document.getElementById('bar').style.width = `${(answered / questions.length) * 100}%`;
  const btn = document.getElementById('submit-btn');
  const hint = document.getElementById('submit-hint');
  if (answered === questions.length) {
    btn.disabled = false;
    hint.textContent = 'All answered — ready to submit!';
  } else {
    btn.disabled = true;
    hint.textContent = `${questions.length - answered} question(s) remaining`;
  }
}

function renderQuiz() {
  const container = document.getElementById('quiz');
  container.innerHTML = '';

  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `qcard-${qi}`;

    const letters = ['A','B','C','D'];

    let optsHTML = q.opts.map((o, oi) => `
      <button class="opt" id="opt-${qi}-${oi}" onclick="selectAnswer(${qi},${oi})">
        <span class="letter">${letters[oi]}.</span>
        <span>${o}</span>
      </button>
    `).join('');

    card.innerHTML = `
      <div class="q-head">
        <span class="q-num">Q${qi + 1}</span>
        <span class="q-text">${q.q}</span>
      </div>
      <div class="options">${optsHTML}</div>
      <div class="explanation" id="exp-${qi}"></div>
    `;
    container.appendChild(card);
  });
}

function selectAnswer(qi, oi) {
  if (submitted) return;

  // Deselect previous
  if (userAnswers[qi] !== null) {
    const prev = document.getElementById(`opt-${qi}-${userAnswers[qi]}`);
    if (prev) prev.classList.remove('selected-correct','selected-wrong','reveal-correct');
  }

  userAnswers[qi] = oi;
  const btn = document.getElementById(`opt-${qi}-${oi}`);
  btn.classList.add('selected-correct'); // highlight as selected (neutral blue-ish until submit)
  btn.classList.remove('selected-correct');
  btn.style.borderColor = 'var(--accent)';
  btn.style.background = 'rgba(79,142,247,0.1)';

  // Reset all, then re-style selected
  questions[qi].opts.forEach((_, i) => {
    const b = document.getElementById(`opt-${qi}-${i}`);
    b.style.borderColor = '';
    b.style.background = '';
  });
  btn.style.borderColor = 'var(--accent)';
  btn.style.background = 'rgba(79,142,247,0.1)';

  updateProgress();
}

function submitExam() {
  if (submitted) return;
  submitted = true;
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('submit-hint').textContent = 'Exam submitted!';

  let correct = 0;

  questions.forEach((q, qi) => {
    const chosen = userAnswers[qi];
    const correct_idx = q.ans;
    const card = document.getElementById(`qcard-${qi}`);
    const exp = document.getElementById(`exp-${qi}`);
    const letters = ['A','B','C','D'];

    // Reset inline styles
    q.opts.forEach((_, i) => {
      const b = document.getElementById(`opt-${qi}-${i}`);
      b.style.borderColor = '';
      b.style.background = '';
      b.disabled = true;
    });

    const isCorrect = (chosen === correct_idx);
    if (isCorrect) correct++;

    if (chosen !== null) {
      const chosenBtn = document.getElementById(`opt-${qi}-${chosen}`);
      chosenBtn.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
    }

    if (!isCorrect) {
      const correctBtn = document.getElementById(`opt-${qi}-${correct_idx}`);
      correctBtn.classList.add('reveal-correct');
    }

    card.classList.add(isCorrect ? 'correct' : 'incorrect');

    exp.className = `explanation ${isCorrect ? 'correct-exp' : 'incorrect-exp'}`;
    exp.style.display = 'block';
    exp.innerHTML = `
      <div class="exp-label">${isCorrect ? '✓ Correct' : '✗ Incorrect'}</div>
      <div class="exp-answer">Answer: ${letters[correct_idx]}. ${q.opts[correct_idx]}</div>
      <div>${q.exp}</div>
    `;
  });

  // Show results
  const pct = Math.round((correct / questions.length) * 100);
  let remark = '';
  if (pct >= 90) remark = '🏆 Outstanding! Excellent mastery!';
  else if (pct >= 75) remark = '✅ Passed! Good understanding.';
  else if (pct >= 60) remark = '📚 Keep studying — almost there!';
  else remark = '💪 More review needed. You got this!';

  const resultsEl = document.getElementById('results');
  resultsEl.style.display = 'block';
  resultsEl.innerHTML = `
    <div class="score-big">${pct}%</div>
    <div class="score-label">${correct} out of ${questions.length} correct</div>
    <div class="remark">${remark}</div>
    <div class="breakdown">
      <div class="bd-box c"><div class="bd-num">${correct}</div><div class="bd-lbl">Correct</div></div>
      <div class="bd-box w"><div class="bd-num">${questions.length - correct}</div><div class="bd-lbl">Incorrect</div></div>
    </div>
    <button class="restart-btn" onclick="restartExam()">Restart Exam</button>
  `;
  resultsEl.scrollIntoView({ behavior: 'smooth' });
  document.getElementById('submit-wrap').style.display = 'none';
}

function restartExam() {
  questions = shuffle(questionBank);
  userAnswers = new Array(questions.length).fill(null);
  submitted = false;
  document.getElementById('results').style.display = 'none';
  document.getElementById('submit-wrap').style.display = 'flex';
  renderQuiz();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize with shuffled questions
questions = shuffle(questionBank);
userAnswers = new Array(questions.length).fill(null);
renderQuiz();
updateProgress();
</script>
